# ─────────────────────────────────────────────────────────────────────────────
# docs-pipeline nginx location blocks
# Paste into your server block BEFORE the catch-all `location / { ... }`
#
# Host port map (see .env — all bind 127.0.0.1 only):
#   API       → 127.0.0.1:${API_HOST_PORT:-8011}
#   UI        → 127.0.0.1:${UI_HOST_PORT:-3011}
#   Keycloak  → 127.0.0.1:${KEYCLOAK_HOST_PORT:-8081}
#
# After adding these blocks, reload nginx:
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────


# ── docs-pipeline FastAPI ─────────────────────────────────────────────────────
location ^~ /docs-pipeline-api/ {
    proxy_pass         http://127.0.0.1:8011/;
    proxy_http_version 1.1;
    proxy_buffering    off;
    proxy_cache        off;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout   300s;
    proxy_send_timeout   300s;
    client_max_body_size 100m;
}


# ── docs-pipeline UI (nginx in ui container) ──────────────────────────────────
location ^~ /docs-pipeline/ {
    proxy_pass         http://127.0.0.1:3011/docs-pipeline/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}


# ── Keycloak (knowledge-engine realm) ─────────────────────────────────────────
# Exposes Keycloak under /auth so the realm issuer URL becomes:
#   https://<your-domain>/auth/realms/knowledge-engine
#
# Update KC_HOSTNAME in .env to match <your-domain> so Keycloak generates
# correct redirect URIs and JWKS URLs in tokens:
#   KC_HOSTNAME=registry-sandbox-vistaar.da.gov.in
#
# Also add KC_HTTP_RELATIVE_PATH=/auth to docker-compose.yml keycloak
# environment when using a path-prefix (see comment in compose file).

location ^~ /auth/ {
    proxy_pass         http://127.0.0.1:8081/auth/;
    proxy_http_version 1.1;
    proxy_buffering    off;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keycloak sets large cookies and response headers
    proxy_buffer_size          128k;
    proxy_buffers              8 128k;
    proxy_busy_buffers_size    256k;

    # Keycloak admin console uses long-polling
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
}
