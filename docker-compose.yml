services:
  # Temporal Server
  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
    depends_on:
      temporal-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  temporal-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal-ui:
    image: temporalio/ui:latest
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Vector index: remote/local Qdrant (VECTOR_BACKEND=qdrant). Marqo is not part of the stack.

  # Keycloak (auth) — external instance, not provisioned here. See KEYCLOAK_* in .env.

  # Language Detection Service (stateless, can scale with --scale flag)
  lang-detect:
    build:
      context: ./lang-detect
      dockerfile: Dockerfile
    # No host port - accessed internally via Docker network. Scale with: docker compose up -d --scale lang-detect=3
    environment:
      - PORT=3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Pipeline API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - TEMPORAL_HOST=temporal:7233
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=documents
      - DOCUMENT_DB_PATH=/data/documents.db
      - LANG_DETECT_URL=http://lang-detect:3000
      # Qdrant is the only vector backend in this stack (remote or host-reachable).
      - VECTOR_BACKEND=${VECTOR_BACKEND:-qdrant}
      - QDRANT_URL=${QDRANT_URL:-http://host.docker.internal:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-documents-index}
      - QDRANT_TIMEOUT_SECONDS=${QDRANT_TIMEOUT_SECONDS:-30}
      - PROD_VECTOR_BACKEND=${PROD_VECTOR_BACKEND:-qdrant}
      - PROD_QDRANT_URL=${PROD_QDRANT_URL:-}
      - PROD_QDRANT_API_KEY=${PROD_QDRANT_API_KEY:-}
      - PROD_QDRANT_COLLECTION_NAME=${PROD_QDRANT_COLLECTION_NAME:-}
      - PROD_QDRANT_TIMEOUT_SECONDS=${PROD_QDRANT_TIMEOUT_SECONDS:-30}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-sentence_transformers}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      - EMBEDDING_VECTOR_SIZE=${EMBEDDING_VECTOR_SIZE:-1024}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      # Hugging Face (local SentenceTransformer model download / cache)
      - HF_HOME=${HF_HOME:-/opt/hf-cache}
      - HF_HUB_CACHE=${HF_HOME:-/opt/hf-cache}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - TRANSLATION_PROVIDER=${TRANSLATION_PROVIDER:-gemma_vllm}
      - TRANSLATION_MODEL=${TRANSLATION_MODEL:-gemma-4-31b-it}
      - TRANSLATION_VLLM_BASE_URL=${TRANSLATION_VLLM_BASE_URL:-http://localhost:8020/v1}
      - TRANSLATION_API_KEY=${TRANSLATION_API_KEY:-}
      - TRANSLATION_PAGE_CONCURRENCY=${TRANSLATION_PAGE_CONCURRENCY:-1}
      - TRANSLATION_MAX_RETRIES=${TRANSLATION_MAX_RETRIES:-6}
      - TRANSLATION_RETRY_BASE_SECONDS=${TRANSLATION_RETRY_BASE_SECONDS:-2.0}
      - OCR_PROVIDER=${OCR_PROVIDER:-chandra}
      - OCR_MODEL=${OCR_MODEL:-chandra}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_OCR_MODEL=${MISTRAL_OCR_MODEL:-mistral-ocr-latest}
      - MISTRAL_OCR_API_URL=${MISTRAL_OCR_API_URL:-https://api.mistral.ai/v1/ocr}
      - CHANDRA_VLLM_BASE_URL=${CHANDRA_VLLM_BASE_URL:-http://host.docker.internal:8010/v1}
      - CHANDRA_INFERENCE_MODE=${CHANDRA_INFERENCE_MODE:-hf}
      - CHANDRA_MAX_OUTPUT_TOKENS=${CHANDRA_MAX_OUTPUT_TOKENS:-12288}
      - CHANDRA_OCR_MAX_WORKERS=${CHANDRA_OCR_MAX_WORKERS:-4}
      - OCR_SEGMENT_PAGES=${OCR_SEGMENT_PAGES:-20}
      - DOMAIN_TAGGING_PROVIDER=${DOMAIN_TAGGING_PROVIDER:-gemma_vllm}
      - DOMAIN_TAGGING_MODEL=${DOMAIN_TAGGING_MODEL:-gemma-4-31b-it}
      - DOMAIN_TAGGING_VLLM_BASE_URL=${DOMAIN_TAGGING_VLLM_BASE_URL:-http://localhost:8020/v1}
      - DOMAIN_TAGGING_ENABLED=${DOMAIN_TAGGING_ENABLED:-true}
      - DOMAIN_TAGGING_STRICT_TAXONOMY=${DOMAIN_TAGGING_STRICT_TAXONOMY:-true}
      - DOMAIN_TAXONOMY_PATH=${DOMAIN_TAXONOMY_PATH:-}
      - CHUNKING_PROVIDER=${CHUNKING_PROVIDER:-qwen_vllm}
      - CHUNKING_MODEL=${CHUNKING_MODEL:-qwen3.5-27b}
      - CHUNKING_VLLM_BASE_URL=${CHUNKING_VLLM_BASE_URL:-http://host.docker.internal:8005/v1}
      - CHUNKING_API_KEY=${CHUNKING_API_KEY:-}
      - CHUNKING_TARGET_CHUNK_TOKENS=${CHUNKING_TARGET_CHUNK_TOKENS:-450}
      - CHUNKING_MAX_CHUNK_TOKENS=${CHUNKING_MAX_CHUNK_TOKENS:-450}
      - CHUNKING_MIN_CHUNK_TOKENS=${CHUNKING_MIN_CHUNK_TOKENS:-100}
      - CHUNKING_OVERLAP_TOKENS=${CHUNKING_OVERLAP_TOKENS:-128}
      - CHUNKING_MAX_PAGES_PER_CHUNK=${CHUNKING_MAX_PAGES_PER_CHUNK:-8}
      - CHUNKING_PAGE_WINDOW_SIZE=${CHUNKING_PAGE_WINDOW_SIZE:-8}
      - CHUNKING_QWEN_ENABLE_THINKING=${CHUNKING_QWEN_ENABLE_THINKING:-false}
      - TEMPORAL_MAX_CONCURRENT_ACTIVITIES=${TEMPORAL_MAX_CONCURRENT_ACTIVITIES:-4}
      # true = documents finish at DEV ingest; PROD approval/promotion stages are skipped
      - DISABLE_PROD_SETTING=${DISABLE_PROD_SETTING:-false}
      - DOCUMENT_METADATA_CSV_PATH=/app/workspace/document_manifest.csv
      - DOCUMENT_DESCRIPTIONS_JSONL_PATH=/app/workspace/document_descriptions.jsonl
      # Auth: keep disabled until UI sends Bearer tokens. Startup logs a loud warning.
      - AUTH_DISABLED=${AUTH_DISABLED:-true}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER:-}
      # Empty audience = skip aud check (SPA tokens from bharat-vistaar use aud=account).
      # Only set KEYCLOAK_AUDIENCE when tokens always include that exact audience claim.
      - KEYCLOAK_AUDIENCE=${KEYCLOAK_AUDIENCE:-}
      - KEYCLOAK_JWKS_URL=${KEYCLOAK_JWKS_URL:-}
      - KEYCLOAK_JWT_LEEWAY_SECONDS=${KEYCLOAK_JWT_LEEWAY_SECONDS:-30}
      # Super-admin Users UI: Keycloak Admin API (provision users/groups) on the external instance.
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:-}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-}
      - KEYCLOAK_ADMIN_BASE_URL=${KEYCLOAK_ADMIN_BASE_URL:-}
      - KEYCLOAK_ADMIN_REALM=${KEYCLOAK_ADMIN_REALM:-}
      - KEYCLOAK_ADMIN_TOKEN_REALM=${KEYCLOAK_ADMIN_TOKEN_REALM:-master}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - DEFAULT_INSTANCE=${DEFAULT_INSTANCE:-default}
      # Master Catalog (Postgres) — points at your existing Postgres instance,
      # no DB container provisioned here. Set these in .env.
      - MASTER_CATALOG_PG_HOST=${MASTER_CATALOG_PG_HOST:-}
      - MASTER_CATALOG_PG_PORT=${MASTER_CATALOG_PG_PORT:-5432}
      - MASTER_CATALOG_PG_DB=${MASTER_CATALOG_PG_DB:-master_catalog}
      - MASTER_CATALOG_PG_USER=${MASTER_CATALOG_PG_USER:-master_catalog}
      - MASTER_CATALOG_PG_PASSWORD=${MASTER_CATALOG_PG_PASSWORD:-}
      - MASTER_CATALOG_PG_SSLMODE=${MASTER_CATALOG_PG_SSLMODE:-disable}
      # AI layer Redis (bharat-oan-api) — direct write of the catalog snapshot
      - AI_LAYER_REDIS_HOST=${AI_LAYER_REDIS_HOST:-}
      - AI_LAYER_REDIS_PORT=${AI_LAYER_REDIS_PORT:-6379}
      - AI_LAYER_REDIS_DB=${AI_LAYER_REDIS_DB:-0}
      - AI_LAYER_REDIS_PASSWORD=${AI_LAYER_REDIS_PASSWORD:-}
      - MASTER_CATALOG_REDIS_TTL_SECONDS=${MASTER_CATALOG_REDIS_TTL_SECONDS:-172800}
    depends_on:
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
      lang-detect:
        condition: service_healthy
    command: uvicorn pipeline.api:app --host 0.0.0.0 --port 8001
    volumes:
      - .:/app/workspace:ro
      - ./books:/app/books:ro
      - sqlite-data:/data
      - ${HF_HOME:-/opt/hf-cache}:${HF_HOME:-/opt/hf-cache}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Pipeline Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - TEMPORAL_HOST=temporal:7233
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=documents
      - DOCUMENT_DB_PATH=/data/documents.db
      - LANG_DETECT_URL=http://lang-detect:3000
      - VECTOR_BACKEND=${VECTOR_BACKEND:-qdrant}
      - QDRANT_URL=${QDRANT_URL:-http://host.docker.internal:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-documents-index}
      - QDRANT_TIMEOUT_SECONDS=${QDRANT_TIMEOUT_SECONDS:-30}
      - PROD_VECTOR_BACKEND=${PROD_VECTOR_BACKEND:-qdrant}
      - PROD_QDRANT_URL=${PROD_QDRANT_URL:-}
      - PROD_QDRANT_API_KEY=${PROD_QDRANT_API_KEY:-}
      - PROD_QDRANT_COLLECTION_NAME=${PROD_QDRANT_COLLECTION_NAME:-}
      - PROD_QDRANT_TIMEOUT_SECONDS=${PROD_QDRANT_TIMEOUT_SECONDS:-30}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-sentence_transformers}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      - EMBEDDING_VECTOR_SIZE=${EMBEDDING_VECTOR_SIZE:-1024}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      # Hugging Face (local SentenceTransformer model download / cache)
      - HF_HOME=${HF_HOME:-/opt/hf-cache}
      - HF_HUB_CACHE=${HF_HOME:-/opt/hf-cache}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - TRANSLATION_PROVIDER=${TRANSLATION_PROVIDER:-gemma_vllm}
      - TRANSLATION_MODEL=${TRANSLATION_MODEL:-gemma-4-31b-it}
      - TRANSLATION_VLLM_BASE_URL=${TRANSLATION_VLLM_BASE_URL:-http://localhost:8020/v1}
      - TRANSLATION_API_KEY=${TRANSLATION_API_KEY:-}
      - TRANSLATION_PAGE_CONCURRENCY=${TRANSLATION_PAGE_CONCURRENCY:-1}
      - TRANSLATION_MAX_RETRIES=${TRANSLATION_MAX_RETRIES:-6}
      - TRANSLATION_RETRY_BASE_SECONDS=${TRANSLATION_RETRY_BASE_SECONDS:-2.0}
      - OCR_PROVIDER=${OCR_PROVIDER:-chandra}
      - OCR_MODEL=${OCR_MODEL:-chandra}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_OCR_MODEL=${MISTRAL_OCR_MODEL:-mistral-ocr-latest}
      - MISTRAL_OCR_API_URL=${MISTRAL_OCR_API_URL:-https://api.mistral.ai/v1/ocr}
      - CHANDRA_VLLM_BASE_URL=${CHANDRA_VLLM_BASE_URL:-http://host.docker.internal:8010/v1}
      - CHANDRA_INFERENCE_MODE=${CHANDRA_INFERENCE_MODE:-hf}
      - CHANDRA_MAX_OUTPUT_TOKENS=${CHANDRA_MAX_OUTPUT_TOKENS:-12288}
      - CHANDRA_OCR_MAX_WORKERS=${CHANDRA_OCR_MAX_WORKERS:-4}
      - OCR_SEGMENT_PAGES=${OCR_SEGMENT_PAGES:-20}
      - DOMAIN_TAGGING_PROVIDER=${DOMAIN_TAGGING_PROVIDER:-gemma_vllm}
      - DOMAIN_TAGGING_MODEL=${DOMAIN_TAGGING_MODEL:-gemma-4-31b-it}
      - DOMAIN_TAGGING_VLLM_BASE_URL=${DOMAIN_TAGGING_VLLM_BASE_URL:-http://localhost:8020/v1}
      - DOMAIN_TAGGING_ENABLED=${DOMAIN_TAGGING_ENABLED:-true}
      - DOMAIN_TAGGING_STRICT_TAXONOMY=${DOMAIN_TAGGING_STRICT_TAXONOMY:-true}
      - DOMAIN_TAXONOMY_PATH=${DOMAIN_TAXONOMY_PATH:-}
      - CHUNKING_PROVIDER=${CHUNKING_PROVIDER:-qwen_vllm}
      - CHUNKING_MODEL=${CHUNKING_MODEL:-qwen3.5-27b}
      - CHUNKING_VLLM_BASE_URL=${CHUNKING_VLLM_BASE_URL:-http://host.docker.internal:8005/v1}
      - CHUNKING_API_KEY=${CHUNKING_API_KEY:-}
      - CHUNKING_TARGET_CHUNK_TOKENS=${CHUNKING_TARGET_CHUNK_TOKENS:-450}
      - CHUNKING_MAX_CHUNK_TOKENS=${CHUNKING_MAX_CHUNK_TOKENS:-450}
      - CHUNKING_MIN_CHUNK_TOKENS=${CHUNKING_MIN_CHUNK_TOKENS:-100}
      - CHUNKING_OVERLAP_TOKENS=${CHUNKING_OVERLAP_TOKENS:-128}
      - CHUNKING_MAX_PAGES_PER_CHUNK=${CHUNKING_MAX_PAGES_PER_CHUNK:-8}
      - CHUNKING_PAGE_WINDOW_SIZE=${CHUNKING_PAGE_WINDOW_SIZE:-8}
      - CHUNKING_QWEN_ENABLE_THINKING=${CHUNKING_QWEN_ENABLE_THINKING:-false}
      - TEMPORAL_MAX_CONCURRENT_ACTIVITIES=${TEMPORAL_MAX_CONCURRENT_ACTIVITIES:-4}
      # true = documents finish at DEV ingest; PROD approval/promotion stages are skipped
      - DISABLE_PROD_SETTING=${DISABLE_PROD_SETTING:-false}
      - DOCUMENT_METADATA_CSV_PATH=/app/workspace/document_manifest.csv
      - DOCUMENT_DESCRIPTIONS_JSONL_PATH=/app/workspace/document_descriptions.jsonl
      # Master Catalog (Postgres) — points at your existing Postgres instance,
      # no DB container provisioned here. Set these in .env.
      - MASTER_CATALOG_PG_HOST=${MASTER_CATALOG_PG_HOST:-}
      - MASTER_CATALOG_PG_PORT=${MASTER_CATALOG_PG_PORT:-5432}
      - MASTER_CATALOG_PG_DB=${MASTER_CATALOG_PG_DB:-master_catalog}
      - MASTER_CATALOG_PG_USER=${MASTER_CATALOG_PG_USER:-master_catalog}
      - MASTER_CATALOG_PG_PASSWORD=${MASTER_CATALOG_PG_PASSWORD:-}
      - MASTER_CATALOG_PG_SSLMODE=${MASTER_CATALOG_PG_SSLMODE:-disable}
      # AI layer Redis (bharat-oan-api) — direct write of the catalog snapshot
      - AI_LAYER_REDIS_HOST=${AI_LAYER_REDIS_HOST:-}
      - AI_LAYER_REDIS_PORT=${AI_LAYER_REDIS_PORT:-6379}
      - AI_LAYER_REDIS_DB=${AI_LAYER_REDIS_DB:-0}
      - AI_LAYER_REDIS_PASSWORD=${AI_LAYER_REDIS_PASSWORD:-}
      - MASTER_CATALOG_REDIS_TTL_SECONDS=${MASTER_CATALOG_REDIS_TTL_SECONDS:-172800}
    depends_on:
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
      lang-detect:
        condition: service_healthy
    command: python -m pipeline.worker
    volumes:
      - .:/app/workspace:ro
      - ./books:/app/books:ro
      - sqlite-data:/data
      - ${HF_HOME:-/opt/hf-cache}:${HF_HOME:-/opt/hf-cache}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # React UI
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_PROXY_TARGET=http://api:8001
    depends_on:
      - api
    restart: unless-stopped

volumes:
  temporal-db-data:
  minio-data:
  sqlite-data:
