# Unified docker-compose — dev and prod use the same file.
# Behaviour is controlled entirely by the .env file you pass at runtime.
#
# Usage:
#   cp .env.example .env    # fill all secrets
#   docker compose --env-file .env up -d --build
#
# Profiles:
#   (default) — all core services
#   ops       — also starts temporal-ui and keycloak-ui (already included in keycloak)
#
# Host ports (all bound to 127.0.0.1 for nginx reverse-proxy; override in .env):
#   API          127.0.0.1:${API_HOST_PORT:-8011}:8001
#   UI           127.0.0.1:${UI_HOST_PORT:-3011}:80
#   Keycloak     127.0.0.1:${KEYCLOAK_HOST_PORT:-8081}:8080
#   Temporal     127.0.0.1:7233:7233
#   MinIO API    127.0.0.1:9000:9000
#   MinIO UI     127.0.0.1:9001:9001
#   Temporal UI  127.0.0.1:${TEMPORAL_UI_PORT:-8090}:8080  (profile: ops)

services:

  # ---------------------------------------------------------------------------
  # Temporal infrastructure
  # ---------------------------------------------------------------------------
  temporal-db:
    image: postgres:15-alpine
    pull_policy: never
    platform: linux/amd64
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:latest
    pull_policy: never
    platform: linux/amd64
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:latest
    pull_policy: never
    platform: linux/amd64
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8090}:8080"
    restart: unless-stopped
    profiles:
      - ops

  # ---------------------------------------------------------------------------
  # MinIO object storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    pull_policy: never
    platform: linux/amd64
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Creates the default bucket on first boot then exits.
  minio-init:
    image: minio/mc:latest
    pull_policy: never
    platform: linux/amd64
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/$${MINIO_BUCKET:-documents} || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
    restart: "no"

  # ---------------------------------------------------------------------------
  # Keycloak (auth) — built from keycloak/Dockerfile which pre-installs the
  # email-OTP 2FA plugin (mesutpiskin/keycloak-2fa-email-authenticator).
  #
  # SMTP details come exclusively from .env (KC_SMTP_* vars) — nothing is
  # hard-coded in the image or in this file.
  #
  # First-boot: --import-realm loads keycloak/import/*.json automatically.
  # Subsequent boots: the flag is a no-op when the realm already exists.
  # ---------------------------------------------------------------------------
  keycloak-db:
    image: postgres:15-alpine
    pull_policy: never
    platform: linux/amd64
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KC_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USERNAME:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: docs-pipeline-keycloak
    pull_policy: never
    platform: linux/amd64
    build:
      context: ./keycloak
      dockerfile: Dockerfile
      # No ARGs that reference secrets — JAR URL is a public GitHub URL.
    env_file:
      - .env
    environment:
      # DB connection — points at the keycloak-db service inside the network.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Admin account — KEYCLOAK_ADMIN/PASSWORD is the bootstrap-admin var name
      # for Keycloak 22.x (KC_BOOTSTRAP_ADMIN_USERNAME/PASSWORD only exist on
      # Keycloak 26+; on 22 they're silently unrecognized and no admin user
      # gets created).
      KEYCLOAK_ADMIN: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      # Hostname — update KC_HOSTNAME in .env to your public URL in prod.
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # KC_PROXY_HEADERS only exists on Keycloak 24+; on 22.x the reverse-proxy
      # header option is KC_PROXY.
      KC_PROXY: edge
      # When nginx proxies /auth/ → container, tell Keycloak the path prefix.
      # This makes issuer URLs, JWKS URLs, and redirect URIs all include /auth.
      # For direct container access (dev, no nginx) leave empty or omit.
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH:-/auth}
      # SMTP (email-OTP plugin reads the realm's SMTP settings; Keycloak
      # picks these up and writes them into the realm on first import, or
      # you can configure them in the Admin UI → Realm settings → Email).
      KC_SPI_EMAIL_SENDER_HOST: ${KC_SMTP_HOST}
      KC_SPI_EMAIL_SENDER_PORT: ${KC_SMTP_PORT:-587}
      KC_SPI_EMAIL_SENDER_FROM: ${KC_SMTP_FROM}
      KC_SPI_EMAIL_SENDER_FROM_DISPLAY_NAME: ${KC_SMTP_FROM_DISPLAY_NAME:-BharatVistaar}
      KC_SPI_EMAIL_SENDER_AUTH: ${KC_SMTP_AUTH:-true}
      KC_SPI_EMAIL_SENDER_STARTTLS: ${KC_SMTP_STARTTLS:-true}
      KC_SPI_EMAIL_SENDER_SSL: ${KC_SMTP_SSL:-false}
      KC_SPI_EMAIL_SENDER_USER: ${KC_SMTP_USERNAME}
      KC_SPI_EMAIL_SENDER_PASSWORD: ${KC_SMTP_PASSWORD}
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8081}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    # --import-realm is a no-op if the realm already exists, so safe to leave on.
    command: start --import-realm
    volumes:
      - keycloak-data:/opt/keycloak/data
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Language detection microservice
  # ---------------------------------------------------------------------------
  lang-detect:
    image: docs-pipeline-lang-detect
    pull_policy: never
    platform: linux/amd64
    build:
      context: ./lang-detect
      dockerfile: Dockerfile
      # Bridge-network DNS/routing adds ~30x latency per request on this host,
      # which compounds badly across npm's many small per-package requests.
      # Host networking during build avoids that (see ui build below).
      network: host
    environment:
      - PORT=3000
    healthcheck:
      test:
        [
          "CMD", "node", "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Pipeline API
  # The image is built once; dev vs prod is controlled by .env values.
  # env_file loads all config; environment: only overrides Docker-network
  # addresses and container paths (these must win over localhost values in .env).
  # ---------------------------------------------------------------------------
  api:
    image: docs-pipeline-api
    pull_policy: never
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Docker-network overrides — these replace the localhost values in .env
      TEMPORAL_HOST: temporal:7233
      MINIO_ENDPOINT: minio:9000
      DOCUMENT_DB_PATH: /data/documents.db
      LANG_DETECT_URL: http://lang-detect:3000
      ALLOWED_FILE_PATHS: /app/books,/data/documents
      # HF cache path propagated into the container
      HF_HOME: ${HF_HOME:-/opt/hf-cache}
      HF_HUB_CACHE: ${HF_HOME:-/opt/hf-cache}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8011}:8001"
    depends_on:
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
      lang-detect:
        condition: service_healthy
      keycloak:
        condition: service_started
    command: uvicorn pipeline.api:app --host 0.0.0.0 --port 8001
    volumes:
      - ./books:/app/books:ro
      - sqlite-data:/data
      - documents-data:/data/documents
      - ${HF_HOME:-/opt/hf-cache}:${HF_HOME:-/opt/hf-cache}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Pipeline Worker
  # ---------------------------------------------------------------------------
  worker:
    image: docs-pipeline-worker
    pull_policy: never
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      TEMPORAL_HOST: temporal:7233
      MINIO_ENDPOINT: minio:9000
      DOCUMENT_DB_PATH: /data/documents.db
      LANG_DETECT_URL: http://lang-detect:3000
      ALLOWED_FILE_PATHS: /app/books,/data/documents
      HF_HOME: ${HF_HOME:-/opt/hf-cache}
      HF_HUB_CACHE: ${HF_HOME:-/opt/hf-cache}
    depends_on:
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_started
      lang-detect:
        condition: service_healthy
    command: python -m pipeline.worker
    volumes:
      - ./books:/app/books:ro
      - sqlite-data:/data
      - documents-data:/data/documents
      - ${HF_HOME:-/opt/hf-cache}:${HF_HOME:-/opt/hf-cache}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # React UI
  # Dockerfile.prod builds a static nginx image; VITE_* args come from .env.
  # ---------------------------------------------------------------------------
  ui:
    image: docs-pipeline-ui
    pull_policy: never
    platform: linux/amd64
    build:
      context: ./ui
      dockerfile: Dockerfile.prod
      # Measured on the sandbox host: default bridge networking adds ~30x
      # latency per request (3.18s vs 0.07s with host networking), which
      # compounds across npm ci's hundreds of per-package requests into a
      # multi-minute+ hang. Host networking during build avoids that.
      network: host
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/docs-pipeline-api}
        VITE_BASE: ${VITE_BASE:-/docs-pipeline/}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-}
        VITE_KEYCLOAK_IDP_HINT: ${VITE_KEYCLOAK_IDP_HINT:-}
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-false}
    ports:
      - "127.0.0.1:${UI_HOST_PORT:-3011}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  temporal-db-data:
  keycloak-db-data:
  keycloak-data:
  minio-data:
  sqlite-data:
  documents-data:
